services:
  - type: web
    name: etech-social-hub-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./database.sqlite
      - key: CORS_ORIGIN
        value: https://socialmedia-beta-six.vercel.app
      - key: JWT_SECRET
        generateValue: true
